<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="monetization" content="$ilp.uphold.com/placeholder-wallet-address">
    <title>Cyber-Arcade UFO Shooter</title>
    <link rel="icon" href="data:,">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui">
        <div id="hud">
            <div class="hud-item">
                <span class="label">WAVE</span>
                <span id="wave" class="value neon-text-blue">1</span>
            </div>
            <div class="hud-item">
                <span class="label">SCORE</span>
                <span id="score" class="value neon-text-blue">0</span>
            </div>
            <div class="hud-item">
                <span class="label">CREDITS</span>
                <span id="credits" class="value neon-text-pink">0</span>
            </div>
            <div class="hud-item">
                <span class="label">NANOBYTES</span>
                <span id="nanobytes" class="value neon-text-purple">0</span>
            </div>
        </div>

        <div id="boss-ui" style="display:none">
            <div class="label" style="text-align: center; color: #ff00ff; letter-spacing: 5px;">MOTHERSHIP</div>
            <div id="boss-hp-bg">
                <div id="boss-hp-bar"></div>
            </div>
        </div>
        
        <div id="crosshair">+</div>

        <div id="menu" class="overlay">
            <h1 class="neon-text-blue">NEON PROTOCOL</h1>
            <div id="upgrades-panel" style="margin-bottom: 20px; text-align: left; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #00f2ff; border-radius: 5px;">
                <h3 style="color: #00f2ff; margin-top: 0; text-align: center;">UPGRADES</h3>
                <div style="display:flex; justify-content: space-between; margin-bottom: 10px;">
                    <span style="color:#fff;">Fire Rate (<span id="upg-fire-lvl">0</span>/5)</span>
                    <button id="btn-upg-fire" class="neon-btn" style="padding: 5px 10px; font-size: 14px;">BUY (100 C)</button>
                </div>
                <div style="display:flex; justify-content: space-between;">
                    <span style="color:#fff;">Speed (<span id="upg-speed-lvl">0</span>/5)</span>
                    <button id="btn-upg-speed" class="neon-btn" style="padding: 5px 10px; font-size: 14px;">BUY (100 C)</button>
                </div>
            </div>
            <button id="daily-reward-btn" class="neon-btn" style="background: rgba(0, 255, 0, 0.1); border-color: #00ff00; color: #00ff00; margin-bottom: 15px; font-size: 16px;">CLAIM DAILY REWARD (+500 C)</button><br>
            <button id="start-btn" class="neon-btn">INITIALIZE</button>
            <div class="controls">
                WASD to Move<br>
                Mouse to Aim & Shoot
            </div>
        </div>

        <div id="shop-overlay" class="overlay" style="display:none">
            <h2 class="neon-text-pink">CYBER SHOP</h2>
            <div class="shop-items">
                <!-- Dynamic items -->
            </div>
            <button id="close-shop-btn" class="neon-btn small">BACK</button>
        </div>

        <div id="game-over" class="overlay" style="display:none">
            <h2 class="neon-text-red">CONNECTION LOST</h2>
            <p>Score: <span id="final-score">0</span></p>
            <button id="revive-btn" class="neon-btn">REVIVE (AD)</button>
            <button id="restart-btn" class="neon-btn small">REBOOT</button>
        </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
